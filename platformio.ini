; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = atmelavr
board = uno
framework = arduino
upload_port = COM4
monitor_speed = 9600

; 라이브러리 사용
;lib_deps = arduino-libraries/Servo

; 컴파일러에게 "include 폴더(-I include)를 전역 검색 경로에 추가해라"라고 지시
;build_flags = -I include

; 1. 메인 프로젝트용 환경

[env:uno_main]
; main.cpp는 포함(+), test로 시작하는 파일은 제외(-)
build_src_filter = +<*> -<test_*.cpp>

; 2. 테스트 코드용 환경

;[env:uno_test_Ultrasonic_Sensor]
; 모두 지우고(-) test_Timer2.cpp 포함(+)
;build_src_filter = -<*> +<../test/test_Ultrasonic_Sensor.cpp> 

;[env:uno_test_Piezo_Speaker]
